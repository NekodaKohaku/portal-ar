<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e19"><meta name="description" content="選擇世界圖片，在現實中放置你的傳送門。支援 iPhone 標記 AR 與 Android WebXR。"><title>Portal / 傳送門實驗室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='9' ry='14' fill='%23090e19' stroke='%234a9dff' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><video id="camera" autoplay playsinline muted hidden></video><main id="app"><header><a class="brand" href="./"><span class="brand-icon">◉</span> PORTAL <span class="edition">REAL WORLD EDITION</span></a><span class="tag">傳送門實驗室</span></header>
<section class="workspace"><div id="stage" aria-label="傳送門 3D 預覽"><div class="stage-heading"><span id="mode">3D 預覽</span><span class="coordinates">01 / PORTAL</span></div><div id="viewport"></div><div class="stage-caption">你的世界，就在眼前。</div></div>
<aside id="settings"><div class="eyebrow">DESTINATION</div><h1>放下一個傳送門</h1><p class="intro">選一張世界圖片，帶到現實中。</p>
<label class="upload" for="image"><img src="assets/default-world.png" id="thumbnail" alt="目前世界圖片"><span><strong>選擇世界圖片</strong><small id="filename">JPG、PNG、WebP · 圖片留在裝置上</small></span><input id="image" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
<label for="world">世界名稱</label><input id="world" type="text" maxlength="48" value="My world" placeholder="輸入世界名稱">
<div class="range-label"><label for="size">傳送門高度</label><output id="size-value">2.2 m</output></div><input id="size" type="range" min="0.5" max="3" step="0.1" value="2.2"><p class="help">地面 AR 使用實際公尺；標記 AR 顯示縮小模型，大小取決於辨識圖尺寸。</p>
<button id="start-marker" class="primary" disabled>開啟相機 · iPhone 標記 AR</button><p class="help">將 <a href="marker.html" target="_blank" rel="noopener">Hiro 辨識圖</a> 列印或顯示在另一台螢幕，平放桌面／地面。看見定位後按 Drop portal；辨識圖需持續留在畫面中。</p>
<button id="start-xr" class="secondary" disabled>Android · 掃描地面 AR</button><button id="start-camera" class="text-button" disabled>只使用相機預覽</button>
<p id="support" class="help">正在檢查裝置支援…</p><p id="status" role="status" aria-live="polite">正在載入傳送門…</p><p class="credit">VRChat 素材研究原型 · 非官方作品</p></aside></section></main>
<div id="ar-hud" hidden><div class="hud-top"><span id="ar-status" role="status">正在開啟相機…</span><button id="exit" aria-label="結束相機">結束</button></div><div class="hud-bottom"><p id="ar-help">把相機對準辨識圖</p><div class="hud-actions"><button id="reset" class="secondary">重新放置</button><button id="drop" class="primary" disabled>Drop portal</button></div></div></div>
<script type="module" src="app.js"></script></body></html>
