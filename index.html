<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e19"><meta name="description" content="選擇世界圖片，在現實中放置你的傳送門。支援 Android WebXR 地面 AR。"><title>Portal / 傳送門實驗室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='9' ry='14' fill='%23090e19' stroke='%234a9dff' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261004-android"></head>
<body><video id="camera" autoplay playsinline muted hidden></video><main id="app"><header><a class="brand" href="./"><span class="brand-icon">◉</span> PORTAL <span class="edition">REAL WORLD EDITION</span></a><div class="header-tools"><span class="tag">傳送門實驗室</span><select id="language" aria-label="Language / 語言 / 言語"><option value="auto">Auto · 系統 · システム</option><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div></header>
<section class="workspace"><div id="stage" aria-label="傳送門 3D 預覽"><div class="stage-heading"><span id="mode">3D 預覽</span><span class="coordinates">01 / PORTAL</span></div><div id="viewport"></div><div class="stage-caption">拖曳旋轉 · 雙指縮放</div></div>
<aside id="settings"><div class="eyebrow">DESTINATION</div><h1>放下一個傳送門</h1><p class="intro">選一張世界圖片，帶到現實中。</p>
<label class="upload" for="image"><img src="assets/default-world.png" id="thumbnail" alt="目前世界圖片"><span><strong>選擇世界圖片</strong><small id="filename">JPG、PNG、WebP · 圖片留在裝置上</small></span><input id="image" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
<button id="clear-image" class="text-button">清除已保存圖片</button><p id="image-storage" class="help">只保存最後一張圖片，新圖片會覆蓋舊圖片。</p>
<label for="world">世界名稱</label><input id="world" type="text" maxlength="48" value="My world" placeholder="輸入世界名稱">
<label for="creator">創建者名稱</label><input id="creator" type="text" maxlength="48" value="Your name" placeholder="輸入創建者名稱">
<div class="form-row"><div><label for="instance">伺服器編號</label><input id="instance" type="text" maxlength="12" value="15247"></div><div><label for="access">類型</label><select id="access"><option value="Invite">Invite</option><option value="Invite+">Invite+</option><option value="Friends">Friends</option><option value="Friends+">Friends+</option><option value="Public">Public</option></select></div></div>
<div class="platform-options"><label><input id="random-instance" type="checkbox">每次 Drop 使用隨機 5 位數</label></div>
<label for="region">伺服器位置</label><select id="region"><option value="jp">日本 · JP</option><option value="us">美國西部 · US West</option><option value="use">美國東部 · US East</option><option value="eu">歐洲 · EU</option></select>
<div class="form-row"><div><label for="occupancy">目前人數</label><input id="occupancy" type="number" min="0" max="999" value="0"></div><div><label for="capacity">人數上限</label><input id="capacity" type="number" min="1" max="999" value="32"></div></div>
<fieldset class="platform-options"><legend>世界支援的平台</legend><label><input id="platform-windows" type="checkbox" checked> Windows</label><label><input id="platform-android" type="checkbox" checked> Android</label><label><input id="platform-apple" type="checkbox"> iOS</label></fieldset>
<div class="range-label"><label for="size">傳送門高度</label><output id="size-value">2.2 m</output></div><input id="size" type="range" min="0.5" max="3" step="0.1" value="2.2"><p class="help">地面 AR 使用實際公尺。</p>
<div class="preview-actions"><button id="preview-drop" class="secondary" disabled>試放 · 30 秒</button><button id="preview-photo" class="secondary" disabled>拍照</button><button id="preview-record" class="secondary" disabled>錄影</button></div>
<button id="start-marker" class="primary" disabled hidden>開啟相機 · iPhone 標記 AR</button>
<button id="start-xr" class="secondary" disabled>Android · 掃描地面 AR</button><button id="start-camera" class="text-button" disabled>只使用相機預覽</button>
<p class="help">地面 AR 只接受水平表面，不會偵測牆壁穿透或周圍障礙物。</p><p id="support" class="help">正在檢查裝置支援…</p><p id="status" role="status" aria-live="polite">正在載入傳送門…</p><p class="credit">VRChat 素材研究原型 · 非官方作品</p></aside></section></main>
<div id="ar-hud" hidden><div id="placement-touch" aria-label="Placement surface"></div><div class="hud-top"><span id="ar-status" role="status">正在開啟相機…</span><button id="exit" aria-label="結束相機">結束</button></div><div class="hud-bottom"><p id="ar-help">把相機對準辨識圖</p><div class="capture-actions"><button id="photo" class="secondary">拍照</button><button id="record" class="secondary">錄影</button></div><div class="hud-actions"><button id="reset" class="secondary">重新放置</button><button id="drop" class="primary" disabled>Drop portal</button></div></div></div>
<dialog id="media-dialog"><div class="media-header"><strong id="media-title">你的傳送門</strong><button id="media-close" aria-label="關閉媒體預覽">關閉</button></div><img id="media-image" alt="拍攝的傳送門" hidden><video id="media-video" controls playsinline hidden></video><p id="media-note">可下載檔案，或分享並儲存到相簿。</p><div class="media-actions"><a id="media-download" class="download">下載</a><button id="media-share" class="secondary">分享／儲存到相簿</button></div></dialog>
<script type="module" src="app.js?v=20261004-android"></script></body></html>
